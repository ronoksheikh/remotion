 F(m,t);t.fromTo($('#tx1',m),{x:-60,opacity:0},{x:0,opacity:1,duration:.8,ease:'power3.out'}).fromTo($('#tx2',m),{x:-60,opacity:0},{x:0,opacity:1,duration:.8,ease:'power3.out'},'<')},
stylecard(m,t){m.innerHTML='<div class="card W2 sc"><div class="sw">'+[['#1659F5','প্রধান'],['#0B1F4D','লেখা'],['#E8590C','জোর']].map(c=>'<div><i style="background:'+c[0]+'"></i><span>'+c[1]+'<br>'+c[0]+'</span></div>').join('')+'</div><div class="sr"><div class="rw s fx"><span>ফন্ট</span><code>বাংলা: Hind Siliguri, ইংরেজি: Space Grotesk</code></div><div class="rw s fx"><span>মেজাজ</span><code>পরিষ্কার, আত্মবিশ্বাসী</code></div><div class="rw s fx"><span>ফাঁকা</span><code>কিনারা থেকে ৮০px</code></div><div class="rw s fx"><span>লেখা</span><code>বড়টা আগে, মোটে ২টা ফন্ট</code></div></div></div>';
 F(m,t);t.fromTo($$('.sw>div',m),{scale:0,opacity:0},{scale:1,opacity:1,duration:.5,stagger:.25,ease:'back.out(2)'}).fromTo($$('.sr .rw',m),{x:-40,opacity:0},{x:0,opacity:1,duration:.5,stagger:.3})},
rect(m,t){m.innerHTML='<div class="card L"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#EAF3FF"/><rect id="rr" fill="#1659F5" rx="12"/></svg></div><div class="card R"><div class="rw f"><code>x="<b id="bx"></b>"</code><span>বাঁ থেকে দূরে</span></div><div class="rw f"><code>y="<b id="by"></b>"</code><span>উপর থেকে দূরে</span></div><div class="rw f"><code>width="<b id="bw"></b>"</code><span>কত চওড়া</span></div><div class="rw f"><code>height="<b id="bh"></b>"</code><span>কত উঁচু</span></div></div>';
 F(m,t);const o={x:50,y:50,w:160,h:100},u=()=>{at(m,'#rr',{x:o.x,y:o.y,width:o.w,height:o.h});[['x',o.x],['y',o.y],['w',o.w],['h',o.h]].forEach(a=>{$('#b'+a[0],m).textContent=Math.round(a[1])})};u();
 t.to(o,{x:150,y:100,w:220,h:150,duration:1.8,ease:'power2.inOut',yoyo:true,repeat:-1,repeatDelay:.6,onUpdate:u})},
steps(m,t){const S=[['M 60 230','কলম রাখো'],['L 200 70','সোজা টানো'],['C 280 70 340 150 340 230','বাঁকা টানো'],['Z','বন্ধ করো']],q='fill="none" stroke="#1659F5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"';
 m.innerHTML='<div class="card L"><svg viewBox="0 0 400 300"><path id="s2" d="M60 230 L200 70" '+q+'/><path id="s3" d="M200 70 C280 70 340 150 340 230" '+q+'/><path id="s4" d="M340 230 L60 230" '+q+'/><circle id="pen" cx="60" cy="230" r="13" fill="#E8590C"/></svg></div><div class="card R p2">'+S.map((x,k)=>'<div class="rw s" id="st'+k+'"><code>'+x[0]+'</code><span>'+x[1]+'</span></div>').join('')+'</div>';
 F(m,t);['#s2','#s3','#s4'].forEach(z=>{const e=$(z,m),l=e.getTotalLength();e.style.strokeDasharray=l;e.style.strokeDashoffset=l});
 const hl=k=>t.call(()=>{for(let j=0;j<4;j++)$('#st'+j,m).classList.toggle('on',j==k)}),E=[[200,70],[340,230],[60,230]];
 hl(0);t.to({},{duration:.9});
 ['#s2','#s3','#s4'].forEach((z,k)=>{hl(k+1);t.to($(z,m),{strokeDashoffset:0,duration:1.3,ease:'power1.inOut'}).to($('#pen',m),{attr:{cx:E[k][0],cy:E[k][1]},duration:1.3,ease:'power1.inOut'},'<')})},
loop(m,t){let c='';for(let i=0;i<50;i++){const r=i*3.4+10,a=i*.55;c+='<circle cx="'+(200+r*Math.cos(a)).toFixed(1)+'" cy="'+(190+r*Math.sin(a)).toFixed(1)+'" r="9" fill="hsl('+(205+i*1.2)+',90%,55%)"/>'}
 m.innerHTML='<div class="card L p"><div class="rw"><code>for (let i = 0; i &lt; 50; i++) {<br>&nbsp;&nbsp;drawCircle(i)<br>}</code><span>এই ৩ লাইন ৫০ বার চলে</span></div></div><div class="card R"><svg viewBox="0 0 400 380"><g id="lg">'+c+'</g></svg></div>';
 F(m,t);t.fromTo($$('#lg circle',m),{attr:{r:0}},{attr:{r:9},duration:.5,stagger:.05,ease:'back.out(2)'})
  .to($('#lg',m),{rotation:360,svgOrigin:'200 190',duration:14,ease:'none',repeat:-1})}
};
const card=c=>'<div class="card lc a">'+(c.n?'<div class="num">'+c.n+'</div>':'')+'<h2>'+c.h+'</h2><p>'+(c.p||'')+'</p>'+(c.s?'<small>'+c.s+'</small>':'')+(c.tag?'<span class="tag">'+c.tag+'</span>':'')+'</div>';
const R={
title:s=>'<div class="orb" id="o1"></div><div class="orb" id="o2"></div><div class="orb" id="o3"></div><span class="chip a">'+s.chip+'</span><h1 class="a">'+s.h+'</h1><p class="sub a">'+s.sub+'</p>',
cards:s=>(s.t?'<h2 class="ttl a">'+s.t+'</h2>':'')+'<div class="cs n'+s.items.length+(s.next?' s':'')+'">'+s.items.map(card).join('')+'</div>'+(s.next?'<div class="card nx a"><small>পরের ক্লাস</small><h2>'+s.next+'</h2></div>':'')+(s.cap?'<p class="cap a">'+s.cap+'</p>':''),
demo:s=>'<h2 class="ttl a">'+s.t+'</h2><div class="dm"></div>'+(s.cap?'<p class="cap a">'+s.cap+'</p>':'')
};
document.title=L.title;
st.insertAdjacentHTML('afterbegin',L.scenes.map(s=>'<section class="scene">'+R[s.k](s)+'</section>').join(''));
const sc=$$('.scene');sc.forEach(()=>dots.append(document.createElement('b')));
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform='scale('+s+')';st.style.left=(innerWidth-1920*s)/2+'px';st.style.top=(innerHeight-1080*s)/2+'px'}
addEventListener('resize',fit);fit();
let i=-1,cur;
function go(n){if(n<0||n>=sc.length)return;if(cur)cur.kill();sc.forEach((e,k)=>e.classList.toggle('on',k==n));[...dots.children].forEach((b,k)=>b.classList.toggle('on',k==n));i=n;
 const s=L.scenes[n],el=sc[n],t=gsap.timeline();sp.textContent=s.say+'\n— '+s.note;
 t.fromTo($$('.a',el),{y:60,opacity:0},{y:0,opacity:1,duration:.7,stagger:.13,ease:'power3.out'});
 gsap.set($$('.orb',el),{y:0});if(s.k=='title')t.to($$('.orb',el),{y:'+=34',duration:2.4,yoyo:true,repeat:-1,ease:'sine.inOut',stagger:.35},0);
 if(s.k=='demo')D[s.d]($('.dm',el),t,s);
 cur=t}
document.addEventListener('click',e=>{if(!e.target.closest('input'))go(i+1)});
addEventListener('keydown',e=>{if([' ','ArrowRight','ArrowDown','Enter'].includes(e.key)){e.preventDefault();go(i+1)}if(['ArrowLeft','ArrowUp','Backspace'].includes(e.key))go(i-1);if(e.key=='s'||e.key=='S')sp.style.display=sp.style.display=='block'?'none':'block'});
go(0);
</script></body></html>
